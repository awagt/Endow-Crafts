about:
  heading: Where Creativity Meets
  heading_emphasis: Personalization
  lead: Endow Crafts is a Qatar-based creative studio specializing in personalized gifts, handcrafted products, event favors, corporate gifting and creative solutions.
  story: We believe the best gifts carry a little of the person who gave them. So we start with your idea — a name, a colour, a logo, a memory — and design every detail around it before anything is made. Handmade care meets modern cutting and personalization technology, so the result feels personal and looks polished, whether it is a single keepsake or several hundred pieces for an event.
  customize_title: Every project is shaped around your…
  customize_items:
  - Theme
  - Occasion
  - Brand
  - Color palette
  - Name
  - Message
  - Event requirements
  - Quantity
  - Budget
  customize_note: Not sure where to start? Share a photo, a Pinterest board or just a feeling — we'll help shape the rest.
  timeline:
  - title: Idea
    text: Your occasion, story or brief
  - title: Design
    text: Layout, fonts and colours
  - title: Personalize
    text: Names, logos and messages
  - title: Craft
    text: Made and finished by hand
  - title: Deliver
    text: Ready to gift, across Qatar
